<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>Lab 3 - Voo do Morcego</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background: #090a10;
      color: #f8fafc;
      font-family: sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 10px;
      padding: 10px;
      min-height: 100dvh;
      user-select: none;
      -webkit-user-select: none;
      touch-action: manipulation;
    }
    #canvas-morcego {
      display: block;
      width: 100%;
      max-width: 900px;
      height: auto;
      aspect-ratio: 960 / 340;
      background: linear-gradient(to bottom, #0a0618 0%, #1a0b2e 50%, #2a0f1f 100%);
      border-radius: 12px;
      touch-action: none;
    }
    .hud {
      display: flex;
      gap: 16px;
      font-size: 16px;
      flex-wrap: wrap;
      justify-content: center;
    }
    .hud span { font-weight: bold; }
    .controles {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
      justify-content: center;
    }
    button {
      background: #f97316;
      color: white;
      border: none;
      padding: 12px 20px;
      border-radius: 20px;
      font-weight: bold;
      cursor: pointer;
      font-family: inherit;
      font-size: 15px;
      min-width: 90px;
      touch-action: manipulation;
    }
    button:active { transform: scale(0.95); }
    button.secundario { background: #7c3aed; }
    button.parar { background: #dc2626; }
    #referencia {
      max-width: 900px;
      width: 100%;
      background: rgba(255,255,255,0.05);
      border-radius: 10px;
      padding: 12px;
      font-size: 13px;
      line-height: 1.6;
      text-align: center;
      color: #cbd5e1;
    }
    #referencia strong { color: #facc15; }
    .perda { color: #f87171; }
    .ganho { color: #4ade80; }
    .ganho-raro { color: #38bdf8; font-weight: bold; }
    @media (max-width: 480px) {
      button { padding: 14px 16px; font-size: 14px; min-width: 80px; }
      .hud { font-size: 14px; }
    }
  </style>
</head>
<body>
<canvas id="canvas-morcego" width="960" height="340"></canvas>
<div class="hud">
  <div>Pontos: <span id="hud-pontos">0</span></div>
  <div>Fase: <span id="hud-fase">1</span></div>
  <div>Vidas: <span id="hud-vidas">♥♥♥</span></div>
</div>
<div class="controles">
  <button onclick="iniciarJogoMorcego()">Iniciar</button>
  <button class="secundario" onclick="subirMorcego()">▲ Subir</button>
  <button class="secundario" onclick="descerMorcego()">▼ Descer</button>
  <button class="parar" onclick="pararJogoMorcego()">Parar</button>
</div>
<div id="referencia">
  <span class="ganho">🕯️ Vela (+15 pts)</span> &nbsp;|&nbsp;
  <span class="ganho-raro">🍦 Sorvete (+50 pts, raro)</span> &nbsp;|&nbsp;
  <span class="perda">🪦 Túmulo (−1 vida, −10 pts)</span><br>
  <strong>Fase sobe a cada 100 pts:</strong> mais velocidade, mais túmulos e sorvetes mais raros.
</div>
<script>
var canvas = document.getElementById("canvas-morcego");
var ctx = canvas.getContext("2d");

var LARGURA = 960, ALTURA = 340;

var morcego = { x: 110, y: ALTURA / 2, vy: 0, tamanho: 22 };
var obstaculos = [];
var pontos = 0;
var vidas = 3;
var fase = 1;
var rodando = false;
var ultimoFrame = 0;
var contadorSpawn = 0;
var teclas = {};
var frameId = null;

document.addEventListener("keydown", function (e) {
  teclas[e.key] = true;
  if (["ArrowUp","ArrowDown"," "].includes(e.key)) e.preventDefault();
});
document.addEventListener("keyup", function (e) { teclas[e.key] = false; });

function bindToque(botao, aoPressionar, aoSoltar) {
  botao.addEventListener("touchstart", function(e){ e.preventDefault(); aoPressionar(); }, {passive:false});
  botao.addEventListener("touchend",   function(e){ e.preventDefault(); aoSoltar(); },    {passive:false});
  botao.addEventListener("mousedown",  aoPressionar);
  botao.addEventListener("mouseup",    aoSoltar);
  botao.addEventListener("mouseleave", aoSoltar);
}

var btnSubir = document.querySelectorAll("button.secundario")[0];
var btnDescer = document.querySelectorAll("button.secundario")[1];

var segurandoSubir = false, segurandoDescer = false;
bindToque(btnSubir,  function(){ segurandoSubir = true;  subirMorcego();  },
                     function(){ segurandoSubir = false; });
bindToque(btnDescer, function(){ segurandoDescer = true; descerMorcego(); },
                     function(){ segurandoDescer = false; });

canvas.addEventListener("touchstart", function(e) {
  e.preventDefault();
  var rect = canvas.getBoundingClientRect();
  var yToque = (e.touches[0].clientY - rect.top) / rect.height;
  if (yToque < 0.5) subirMorcego(); else descerMorcego();
}, {passive:false});

function subirMorcego()  { morcego.vy = -260; }
function descerMorcego() { morcego.vy =  260; }

function iniciarJogoMorcego() {
  if (frameId) cancelAnimationFrame(frameId);
  morcego = { x: 110, y: ALTURA / 2, vy: 0, tamanho: 22 };
  obstaculos = [];
  pontos = 0; vidas = 3; fase = 1; contadorSpawn = 0;
  rodando = true;
  ultimoFrame = performance.now();
  frameId = requestAnimationFrame(loop);
}

function pararJogoMorcego() {
  rodando = false;
  if (frameId) cancelAnimationFrame(frameId);
  frameId = null;
}

// ---- Sorteio de tipo de obstáculo baseado na fase ----
function sortearTipo(fase) {
  var r = Math.random();
  // Chance de túmulo: começa em 45%, sobe até 70% na fase 6+
  var chanceTumulo = Math.min(0.70, 0.45 + (fase - 1) * 0.05);
  // Chance de sorvete: começa em 12%, cai até 4% na fase 7+ (raro)
  var chanceSorvete = Math.max(0.04, 0.12 - (fase - 1) * 0.015);
  // Vela: o restante (garante soma 1)
  var chanceVela = 1 - chanceTumulo - chanceSorvete;

  if (r < chanceTumulo) return "tumulo";
  if (r < chanceTumulo + chanceVela) return "vela";
  return "sorvete";
}

function loop(tempo) {
  if (!rodando) return;
  var dt = Math.min((tempo - ultimoFrame) / 1000, 0.05);
  ultimoFrame = tempo;

  if (teclas["ArrowUp"]   || teclas["w"] || segurandoSubir)  morcego.vy = -260;
  if (teclas["ArrowDown"] || teclas["s"] || segurandoDescer) morcego.vy =  260;

  morcego.y += morcego.vy * dt;
  morcego.vy *= 0.88;
  if (morcego.y < 24) morcego.y = 24;
  if (morcego.y > ALTURA - 24) morcego.y = ALTURA - 24;

  var novaFase = 1 + Math.floor(pontos / 100);
  if (novaFase !== fase) fase = novaFase;

  var multiplicadorVelocidade = 1 + (fase - 1) * 0.4;

  var intervaloSpawn = Math.max(0.45, 1.25 - (fase - 1) * 0.15);

  contadorSpawn += dt;
  if (contadorSpawn > intervaloSpawn) {
    contadorSpawn = 0;
    var qtdSpawn = 1 + Math.floor((fase - 1) / 3);
    for (var s = 0; s < qtdSpawn; s++) {
      obstaculos.push({
        x: LARGURA + 40 + s * 60,
        y: 40 + Math.random() * (ALTURA - 100),
        r: 26,
        tipo: sortearTipo(fase)
      });
    }
  }

  obstaculos.forEach(function (o) { o.x -= 280 * multiplicadorVelocidade * dt; });

  for (var i = obstaculos.length - 1; i >= 0; i--) {
    var o = obstaculos[i];
    var dx = o.x - morcego.x;
    var dy = o.y - morcego.y;
    if (Math.sqrt(dx*dx + dy*dy) < o.r + morcego.tamanho * 0.7) {
      if (o.tipo === "vela") {
        pontos += 15;
      } else if (o.tipo === "sorvete") {
        pontos += 50;
      } else {
        vidas--;
        pontos = Math.max(0, pontos - 10);
        if (vidas <= 0) { rodando = false; }
      }
      obstaculos.splice(i, 1);
    } else if (o.x < -50) {
      obstaculos.splice(i, 1);
    }
  }

  document.getElementById("hud-pontos").innerText = pontos;
  document.getElementById("hud-fase").innerText = fase;
  document.getElementById("hud-vidas").innerText =
    "\u2665".repeat(Math.max(0, vidas)) || "—";

  desenhar();
  if (rodando) frameId = requestAnimationFrame(loop);
}

function desenhar() {
  var grad = ctx.createLinearGradient(0, 0, 0, ALTURA);
  grad.addColorStop(0, "#0a0618");
  grad.addColorStop(0.6, "#1a0b2e");
  grad.addColorStop(1, "#2a0f1f");
  ctx.fillStyle = grad;
  ctx.fillRect(0, 0, LARGURA, ALTURA);

  ctx.fillStyle = "#fef3c7";
  ctx.beginPath();
  ctx.arc(LARGURA - 80, 60, 30, 0, Math.PI * 2);
  ctx.fill();

  ctx.textAlign = "center";
  ctx.textBaseline = "middle";
  obstaculos.forEach(function (o) {
    if (o.tipo === "vela") {
      ctx.font = "32px serif";
      ctx.fillText("\uD83D\uDD6F\uFE0F", o.x, o.y);
    } else if (o.tipo === "sorvete") {
      ctx.font = "36px serif";
      ctx.fillText("\uD83C\uDF66", o.x, o.y);
    } else {
      ctx.font = "32px serif";
      ctx.fillText("\uD83E\uDEA6", o.x, o.y);
    }
  });

  ctx.font = "44px serif";
  ctx.fillText("\uD83E\uDD87", morcego.x, morcego.y);

  if (!rodando && vidas <= 0) {
    ctx.fillStyle = "rgba(0,0,0,0.72)";
    ctx.fillRect(0, 0, LARGURA, ALTURA);
    ctx.fillStyle = "#f97316";
    ctx.font = "bold 34px sans-serif";
    ctx.fillText("GAME OVER", LARGURA / 2, ALTURA / 2 - 20);
    ctx.fillStyle = "#facc15";
    ctx.font = "bold 20px sans-serif";
    ctx.fillText("Pontos: " + pontos + "  |  Fase: " + fase, LARGURA / 2, ALTURA / 2 + 20);
  }
}
</script>
</body>
</html>
